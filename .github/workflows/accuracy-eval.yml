name: Accuracy evaluation

on:
  push:
    branches: [feature/medication-followup]
    paths: ['.github/scripts/accuracy/**', '.github/workflows/accuracy-eval.yml']
  workflow_dispatch:

env:
  BASE: https://medvaani-git-feature-medication-d9af8c-anants-projects-62dcac1f.vercel.app

permissions:
  contents: read
  statuses: read
  deployments: read

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        working-directory: .github/scripts/accuracy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install reportlab requests pymupdf pillow pytest

      # The scorer must reject known-wrong answers before it scores anything live.
      - name: Scorer self-tests
        run: python -m pytest -q test_scoring.py

      # Reports are pre-generated and committed: 15 countries plus Shami's
      # report (CJK fonts are not installed on the runner).

      # Test the deployment of THIS commit, not the previous one.
      - name: Wait for this commit's preview deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 1 60); do
            state=$(gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/status" \
              --jq '[.statuses[] | select(.context | test("Vercel"; "i"))][0].state // "pending"')
            echo "vercel status: $state"
            [ "$state" = "success" ] && exit 0
            [ "$state" = "failure" ] || [ "$state" = "error" ] && exit 1
            sleep 20
          done
          echo "Timed out waiting for the preview deployment"; exit 1

      - name: PDFs and questions
        working-directory: ${{ github.workspace }}
        env: {EVAL_MODE: pdf}
        run: python .github/scripts/accuracy/live_eval.py "$BASE" test_data/world test_data/shami

      - name: Check thresholds
        if: always()
        working-directory: ${{ github.workspace }}
        run: |
          set +e
          python .github/scripts/accuracy/check_thresholds.py out
          code=$?
          [ -f out/summary.md ] && cat out/summary.md >> "$GITHUB_STEP_SUMMARY"
          exit $code

      - name: Keep raw responses and scores
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: accuracy-run
          path: out/
          if-no-files-found: warn
